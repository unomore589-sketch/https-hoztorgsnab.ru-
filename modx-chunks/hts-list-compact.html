<!-- Компактные карточки каталога на телефоне (13.11.2026).
     Карточка товара занимала 636px при экране 839px: под фото оставалось пустое поле (блок фото фиксированной
     высоты 290px при фото 170px), артикул и наличие стояли в две строки, а каждая из двух цен — в строке высотой
     40px. Здесь только оформление, без скрипта: фото ниже, артикул и наличие в одну строку, «Розница» и «Опт» —
     две тонкие строки, название чуть мельче и показывается целиком. В одном ряду цены и кнопки стоят на одной линии. Кнопки «−», «+» и «В корзину»
     остаются теми же. На экранах шире 480px блок ничего не меняет.
     После каждой открывающей фигурной скобки стоит пробел или перенос строки, и в коде нет двойных
