<!-- Нижняя панель на телефоне (13.11.2026): «Каталог», «Поиск», «Корзина» со счётчиком, «Кабинет», «Позвонить».
     Раньше поиск, корзина и меню уезжали вверх вместе с шапкой, и из середины длинного раздела до корзины
     приходилось листать обратно. Панель закреплена внизу экрана на всех страницах сайта и показывается только
     на экранах до 768px; на компьютере её нет. Прячется, пока открыта клавиатура или панель фильтров.
     Вызов этого чанка стоит в конце чанка Footers.
     После каждой открывающей фигурной скобки стоит пробел или перенос строки, и в коде нет двойных
     квадратных скобок: так его не тронет ни разборщик MODX, ни Fenom. -->
<nav class="hts-bb" aria-label="Быстрая навигация">
  <a class="hts-bb-i" href="/catalog/" data-k="catalog">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.2"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.2"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.2"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.2"/></svg>
    <span>Каталог</span>
  </a>
  <button type="button" class="hts-bb-i" data-k="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
    <span>Поиск</span>
  </button>
  <a class="hts-bb-i" href="/cart.html" data-k="cart" aria-label="Корзина">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 5h2.2l2.1 10.5h9.6l2-7.5H7"/><circle cx="9.5" cy="19.2" r="1.4"/><circle cx="17" cy="19.2" r="1.4"/></svg>
    <span>Корзина</span>
    <i class="hts-bb-n" aria-hidden="true"></i>
  </a>
  <a class="hts-bb-i" href="/avtorizacziya.html" data-k="cabinet">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8.5" r="3.6"/><path d="M5 20c.9-3.9 3.9-5.6 7-5.6s6.1 1.7 7 5.6"/></svg>
    <span>Кабинет</span>
  </a>
  <a class="hts-bb-i" href="tel:+74951202314" data-k="call">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.2 4h3l1.6 4.2-2.1 1.5a11 11 0 0 0 5.6 5.6l1.5-2.1 4.2 1.6v3a2 2 0 0 1-2.2 2A15.5 15.5 0 0 1 4.2 6.2 2 2 0 0 1 6.2 4z"/></svg>
    <span>Позвонить</span>

</nav>
<style>
.hts-bb { display: none }

@media (max-width: 768px) {
  .hts-bb { display: flex !important; position: fixed !important; left: 0 !important; right: 0 !important; bottom: 0 !important; z-index: 9000 !important; margin: 0 !important; padding: 0 0 env(safe-area-inset-bottom, 0px) !important; background: #fff !important; border-top: 1px solid #dfe3e8 !important; box-shadow: 0 -2px 10px rgba(20, 24, 30, .08) !important }
  .hts-bb-i { flex: 1 1 0 !important; min-width: 0 !important; display: flex !important; flex-direction: column !important; align-items: center !important; justify-content: center !important; gap: 3px !important; min-height: 56px !important; margin: 0 !important; padding: 6px 2px !important; border: 0 !important; border-radius: 0 !important; background: none !important; color: #4b5563 !important; font: 600 11px/1.1 "PT Sans", Arial, sans-serif !important; text-transform: none !important; text-decoration: none !important; position: relative !important; cursor: pointer !important; touch-action: manipulation !important; -webkit-tap-highlight-color: transparent !important; box-shadow: none !important }
  .hts-bb-i:hover, .hts-bb-i:focus { color: #4b5563 !important; background: none !important; text-decoration: none !important }
  .hts-bb-i:active { background: #eef1f4 !important }
  .hts-bb-i:focus-visible { outline: 2px solid #2E4FEA !important; outline-offset: -3px !important }
  .hts-bb-i svg { width: 24px !important; height: 24px !important; flex: 0 0 24px !important; display: block !important }
  .hts-bb-i span { display: block !important; max-width: 100% !important; overflow: hidden !important; text-overflow: ellipsis !important; white-space: nowrap !important }
  .hts-bb-i.hts-bb-on, .hts-bb-i.hts-bb-on:hover, .hts-bb-i.hts-bb-on:focus { color: #2F8F00 !important }
  .hts-bb-n { display: none !important; position: absolute !important; top: 4px !important; left: calc(50% + 4px) !important; min-width: 18px !important; height: 18px !important; padding: 0 5px !important; border-radius: 9px !important; background: #d32f2f !important; color: #fff !important; font: 700 11px/18px "PT Sans", Arial, sans-serif !important; font-style: normal !important; text-align: center !important }
  .hts-bb-n.hts-bb-has { display: block !important }

  /* отступ внизу страницы, чтобы панель не закрывала подвал; на body его ставить нельзя: у body высота ровно на экран */
  #wrapper1 { padding-bottom: calc(60px + env(safe-area-inset-bottom, 0px)) !important }
  html.hts-bb-hide .hts-bb, html.hts-f-on .hts-bb { display: none !important }
}
</style>
<script>
(function () {
  if (window.htsBottomBarBound) return;
  window.htsBottomBarBound = true;

  var root = document.documentElement;
  var narrow = window.matchMedia ? window.matchMedia('(max-width: 768px)') : null;

  function items() { return document.querySelectorAll('.hts-bb .hts-bb-i'); }

  // подсветка раздела, в котором сейчас покупатель
  function mark() {
    var p = location.pathname, k = '';
    if (p.indexOf('/catalog') === 0) k = 'catalog';
    else if (p.indexOf('/poisk') === 0) k = 'search';
    else if (p.indexOf('/cart') === 0) k = 'cart';
    else if (p.indexOf('/avtorizacziya') === 0 || p.indexOf('/profil') === 0) k = 'cabinet';
    [].forEach.call(items(), function (a) {
      var on = a.getAttribute('data-k') === k;
      a.classList.toggle('hts-bb-on', on);
      if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
  }

  // число штук в корзине: «99+», чтобы счётчик не распирал панель, когда берут сотни рулонов
  function badge(n) {
    var cart = document.querySelector('.hts-bb [data-k="cart"]');
    if (!cart) return;
    var b = cart.querySelector('.hts-bb-n');
    n = parseInt(n, 10) || 0;
    b.textContent = n > 99 ? '99+' : String(n);
    b.classList.toggle('hts-bb-has', n > 0);
    cart.setAttribute('aria-label', n > 0 ? 'Корзина, ' + n + ' шт.' : 'Корзина');
  }
  function fromHeader() {
    var e = document.querySelector('#msMiniCart .ms2_total_count') || document.querySelector('.ms2_total_count');
    badge(e ? e.textContent : 0);
  }

  // «Поиск»: строка поиска в шапке; фокус ставим сразу, в том же нажатии, иначе на iPhone не откроется клавиатура
  function searchInput() {
    var all = document.querySelectorAll('input[name=query]');
    for (var i = 0; i < all.length; i++) {
      var r = all[i].getBoundingClientRect();
      if (r.width > 0 && r.height > 0 && !all[i].closest('.add-product-from-cart-form')) return all[i];
    }
    return null;
  }
  document.addEventListener('click', function (e) {
    var b = e.target && e.target.closest ? e.target.closest('.hts-bb [data-k="search"]') : null;
    if (!b) return;
    e.preventDefault();
    var input = searchInput();
    if (input) { try { input.focus({ preventScroll: true }); } catch (err) { input.focus(); } }
    window.scrollTo(0, 0);
  });

  // пока набирают текст, панель не закрывает поля и кнопки над клавиатурой
  function typing(el) { return !!el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName) && !/^(checkbox|radio|button|submit|range)$/.test(el.type || ''); }
  document.addEventListener('focusin', function (e) { if (typing(e.target)) root.classList.add('hts-bb-hide'); });
  document.addEventListener('focusout', function () {
    setTimeout(function () { if (!typing(document.activeElement)) root.classList.remove('hts-bb-hide'); }, 120);
  });

  // каждый ответ miniShop2 приносит новое число штук
  if (window.jQuery) {
    jQuery(document).ajaxSuccess(function (e, xhr, settings) {
      if (!settings || String(settings.url).indexOf('minishop2/action.php') < 0) return;
      var r = xhr.responseJSON;
      if (!r) { try { r = JSON.parse(xhr.responseText); } catch (err) { return; } }
      if (r && r.success && r.data && typeof r.data.total_count !== 'undefined') badge(r.data.total_count);
    });
  }
  window.addEventListener('pageshow', fromHeader);   // «Назад» из корзины показывает страницу из памяти браузера

  function start() { mark(); fromHeader(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
</script>
