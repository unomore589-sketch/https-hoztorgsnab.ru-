<style>
@media (min-width:769px){
  #hts-mobile-orders{display:none!important}
}
@media (max-width:768px){
  #office-minishop2-grid{display:none!important}
}
.hts-mo{max-width:600px!important;margin:0 auto!important;font-size:15px!important}
.hts-mo-toolbar{display:flex!important;justify-content:flex-end!important;margin-bottom:10px!important}
.hts-mo-refresh{border:1px solid #d7dae3!important;background:#fff!important;border-radius:8px!important;padding:6px 12px!important;font-size:13px!important;cursor:pointer!important}
.hts-mo-card{border:1px solid #e3e6f0!important;border-radius:12px!important;padding:14px!important;margin-bottom:12px!important;background:#fff!important}
.hts-mo-top{display:flex!important;justify-content:space-between!important;align-items:baseline!important;margin-bottom:8px!important}
.hts-mo-num{font-weight:700!important;color:#1f2937!important;font-size:15px!important}
.hts-mo-date{font-size:12px!important;color:#6b7280!important}
.hts-mo-mid{display:flex!important;justify-content:space-between!important;align-items:center!important;margin-bottom:8px!important;flex-wrap:wrap!important;gap:6px!important}
.hts-mo-badge{font-size:12px!important;padding:3px 10px!important;border-radius:99px!important;font-weight:600!important;background:#eef0f4!important;color:#444!important}
.hts-mo-badge.new{background:#e6f0ff!important;color:#1d4ed8!important}
.hts-mo-badge.done{background:#e5f6e0!important;color:#2f7d1e!important}
.hts-mo-badge.cancel{background:#fde3e3!important;color:#b3261e!important}
.hts-mo-badge.work{background:#fff2d9!important;color:#a15c00!important}
.hts-mo-sum{font-weight:700!important;color:#1f2937!important}
.hts-mo-line{font-size:13px!important;color:#4b5563!important;margin-bottom:2px!important}
.hts-mo-toggle{width:100%!important;text-align:center!important;padding:8px!important;border:1px solid #d7dae3!important;border-radius:8px!important;background:#fff!important;font-size:13px!important;color:#374151!important;cursor:pointer!important;margin-top:6px!important}
.hts-mo-items{border-top:1px dashed #e3e6f0!important;margin-top:10px!important;padding-top:10px!important;display:none!important}
.hts-mo-items.open{display:block!important}
.hts-mo-item{display:flex!important;justify-content:space-between!important;gap:10px!important;font-size:13px!important;padding:5px 0!important;border-bottom:1px solid #f3f4f6!important}
.hts-mo-item:last-child{border-bottom:none!important}
.hts-mo-item a{color:#1f2937!important;text-decoration:none!important}
.hts-mo-item .hts-mo-qty{color:#6b7280!important;white-space:nowrap!important}
.hts-mo-empty,.hts-mo-loading,.hts-mo-error{text-align:center!important;color:#6b7280!important;padding:24px 0!important;font-size:14px!important}
.hts-mo-error{color:#b3261e!important}
</style>

<div id="hts-mobile-orders" class="hts-mo">
  <div class="hts-mo-toolbar"><button class="hts-mo-refresh" onclick="htsMoLoad()">Обновить</button></div>
  <div id="hts-mo-list"><div class="hts-mo-loading">Загрузка заказов…</div></div>
</div>

<script>
(function(){
  function htsMoStatusClass(text){
    text=(text||'').toLowerCase();
    if(text.indexOf('нов')>-1) return 'new';
    if(text.indexOf('выполн')>-1||text.indexOf('заверш')>-1) return 'done';
    if(text.indexOf('отмен')>-1) return 'cancel';
    if(text.indexOf('обработ')>-1||text.indexOf('сбор')>-1||text.indexOf('пути')>-1) return 'work';
    return '';
  }
  function htsMoText(html){
    var d=document.createElement('div'); d.innerHTML=html||''; return d.textContent.trim();
  }
  function htsMoDate(s){
    if(!s) return '';
    var p=s.split(/[- :]/);
    if(p.length<5) return s;
    return p[2]+'.'+p[1]+'.'+p[0]+' '+p[3]+':'+p[4];
  }
  function htsMoMoney(v){
    v=parseFloat(v||0);
    return v.toLocaleString('ru-RU')+' ₽';
  }

  window.htsMoLoad=function(){
    var list=document.getElementById('hts-mo-list');
    list.innerHTML='<div class="hts-mo-loading">Загрузка заказов…</div>';
    var body=new URLSearchParams({action:'minishop2/getOrders',start:'0',limit:'20',pageId:'81'});
    fetch('/assets/components/office/action.php',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:body})
      .then(function(r){return r.json();})
      .then(function(data){
        if(!data.success||!data.results||!data.results.length){
          list.innerHTML='<div class="hts-mo-empty">Заказов пока нет</div>';
          return;
        }
        list.innerHTML='';
        data.results.forEach(function(o){
          var statusText=htsMoText(o.status);
          var cls=htsMoStatusClass(statusText);
          var card=document.createElement('div');
          card.className='hts-mo-card';
          card.innerHTML=
            '<div class="hts-mo-top">'+
              '<span class="hts-mo-num">Заказ №'+o.num+'</span>'+
              '<span class="hts-mo-date">'+htsMoDate(o.createdon)+'</span>'+
            '</div>'+
            '<div class="hts-mo-mid">'+
              '<span class="hts-mo-badge '+cls+'">'+statusText+'</span>'+
              '<span class="hts-mo-sum">'+htsMoMoney(o.cost)+'</span>'+
            '</div>'+
            '<div class="hts-mo-line">Доставка: '+(o.delivery||'—')+'</div>'+
            (o.payment?('<div class="hts-mo-line">Оплата: '+o.payment+'</div>'):'')+
            '<button class="hts-mo-toggle" data-id="'+o.id+'" onclick="htsMoToggle(this)">Показать состав заказа</button>'+
            '<div class="hts-mo-items" id="hts-mo-items-'+o.id+'"></div>';
          list.appendChild(card);
        });
      })
      .catch(function(){
        list.innerHTML='<div class="hts-mo-error">Не удалось загрузить заказы. Обновите страницу.</div>';
      });
  };

  window.htsMoToggle=function(btn){
    var id=btn.getAttribute('data-id');
    var box=document.getElementById('hts-mo-items-'+id);
    var opened=box.classList.contains('open');
    if(opened){
      box.classList.remove('open');
      btn.textContent='Показать состав заказа';
      return;
    }
    box.classList.add('open');
    btn.textContent='Скрыть состав заказа';
    if(box.dataset.loaded) return;
    box.innerHTML='<div class="hts-mo-loading">Загрузка…</div>';
    var body=new URLSearchParams({action:'minishop2/getOrderProducts',start:'0',limit:'50',order_id:id,pageId:'81'});
    fetch('/assets/components/office/action.php',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:body})
      .then(function(r){return r.json();})
      .then(function(data){
        if(!data.success||!data.results||!data.results.length){
          box.innerHTML='<div class="hts-mo-empty">Нет данных о составе</div>';
          return;
        }
        box.innerHTML='';
        data.results.forEach(function(p){
          var row=document.createElement('div');
          row.className='hts-mo-item';
          var nameHtml=p.url?('<a href="'+p.url+'">'+p.name+'</a>'):p.name;
          row.innerHTML='<span>'+nameHtml+'</span><span class="hts-mo-qty">'+p.count+' × '+htsMoMoney(p.price)+'</span>';
          box.appendChild(row);
        });
        box.dataset.loaded='1';
      })
      .catch(function(){
        box.innerHTML='<div class="hts-mo-error">Ошибка загрузки состава</div>';
      });
  };

  if(document.getElementById('hts-mo-list')){
    htsMoLoad();
  }
})();
</script>
